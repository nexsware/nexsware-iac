name: Deploy Vultr Database VPS Prod
on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to deploy'
                required: true
                default: 'prod'
                type: choice
                options:
                - prod
    push:
        branches:
        - main
        paths:
        - '.github/workflows/create-vultr-db-instance-prod-ci.yml'

jobs:
    deploy-database-vps:
        uses: nexsware/modules/.github/workflows/deploy-vultr-postgres-self-hosted.yml@main
        secrets: inherit
        with:
            environment: "prod"
            region: "jnb"
            plan: "vhf-1c-1gb"
            os_id: 2284  # Ubuntu 24.04 x64  LTS
            label: "prod-vultr-database-server"
            postgres_version: "18"
            listen_address: "*"
            port: 5432
            databases: Safii
            service_account_username: "svc-safii-api"
            state_key: "prod-database-vps"
            state_bucket: "nexsware-terraform-state-prod"
            firewall_group_id: "efee4ce4-9615-4a4f-8277-f568ad8755e0" # Set after create-vultr-db-fwl-prod-ci.yml has run
            vpc_ids: "fb10736d-ee5c-4448-8c22-299fc0a34997" # Prod VPC created by create-vultr-vpc-prod-ci.yml
            private_ip: '10.1.0.65'      # first usable IP in database subnet
            db_subnet: '10.1.0.64/26'
            app_subnet: '10.1.0.0/26'      # cloud-init: UFW allow 5432 + VPC route
            bastion_subnet: '10.1.0.128/26'  # cloud-init: UFW allow 5432 for tunneling + VPC route
