name: Create Vultr VPC Prod CI

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to deploy"
                required: true
                default: "prod"
                type: choice
                options:
                    - prod

    push:
        branches:
            - main
        paths:
            - ".github/workflows/create-vultr-vpc-prod-ci.yml"

jobs:
    create-vpc:
        name: Create Vultr VPC
        uses: nexsware/modules/.github/workflows/deploy-vultr-vpc.yml@main
        secrets:
            VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
            VULTR_OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.VULTR_OBJECT_STORAGE_ACCESS_KEY }}
            VULTR_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.VULTR_OBJECT_STORAGE_SECRET_KEY }}
        with:
            environment: ${{ inputs.environment}}
            state_key: "${{ inputs.environment}}-vpc"
            state_bucket: "nexsware-terraform-state-prod"
            region: "jnb"
            description: "VPC for Nexsware infrastructure"
            ip_block: "10.1.0.0"
            prefix_length: 24