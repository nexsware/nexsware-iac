name: Deploy Vultr Safii Object Storage Prod

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-vultr-safii-object-storage-prod-ci.yml'

jobs:
  deploy-state-storage:
    uses: nexsware/modules/.github/workflows/deploy-vultr-object-storage.yml@main
    secrets: inherit
    with:
      cluster_id: 6  # Vultr Object Storage cluster ID for Amsterdam
      tier_id: 2  # Standard performance tier
      label: "Safii Object Storage Prod"
      environment: ${{ inputs.environment }}
      state_key: "${{ inputs.environment }}-safii-object-storage"
      state_bucket: "nexsware-terraform-state-prod"  # bucket already exists, so state is persisted rather than local
      state_endpoint: "https://ams1.vultrobjects.com"
