name: Deploy Vultr Safii UI Instance Prod
on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to deploy'
                required: true
                default: 'prod'
                type: choice
                options:
                - prod
    push:
        branches:
        - main
        paths:
        - '.github/workflows/create-vultr-ui-instance-prod-ci.yml'
jobs:
    deploy-ui:
        name: Deploy Vultr Safii UI Instance Prod
        uses: nexsware/modules/.github/workflows/deploy-vultr-instance.yml@main
        secrets: inherit
        with:
            environment: "prod"
            region: "jnb"
            plan: "vc2-1c-1gb"  # Adjust as needed
            os_id: 2284  # Ubuntu 24.04 x64 LTS
            label: "prod-safii-ui-host"
            state_key: "prod-safii-ui-vps"
            state_bucket: "nexsware-terraform-state-prod"
            vpc_ids: "fb10736d-ee5c-4448-8c22-299fc0a34997" # Prod VPC created by create-vultr-vpc-prod-ci.yml
            ssh_key_ids: "caf0a6fb-b120-4648-b6e0-9018519e6b10" # Reference to the SSH key created separately
            private_ip: '10.1.0.3'        # next free IP in the app subnet after the API host (10.1.0.2)
            instance_subnet: '10.1.0.0/26'
