name: Deploy Vultr Bastion Firewall Prod
on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to deploy'
                required: true
                default: 'prod'
                type: choice
                options:
                - prod
    push:
        branches:
        - main
        paths:
        - '.github/workflows/create-vultr-bastion-fwl-prod-ci.yml'

jobs:
    deploy-firewall:
        uses: nexsware/modules/.github/workflows/deploy-vultr-firewall.yml@main
        secrets: inherit
        with:
            environment: "${{ inputs.environment}}"
            description: "Bastion Firewall for Nexsware infrastructure"
            firewall_type: "custom"
            state_key: "${{ inputs.environment}}-bastion-firewall"
            state_bucket: "nexsware-terraform-state-prod"
            enable_ssh: true
            allow_ssh_from: "0.0.0.0/0"
